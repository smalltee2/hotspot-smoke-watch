# One-off: check the GSMaP binary orientation used by scripts/gsmap.mjs against the netCDF of the same hour (explicit lat/lon)
name: GSMaP orientation check
on:
  push:
    branches: [main]
    paths: ['.github/workflows/gsmap-orient.yml']
permissions: { contents: read }
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: '22' }
      - name: Compare
        env:
          GSMAP_USER: ${{ secrets.GSMAP_USER }}
          GSMAP_PASS: ${{ secrets.GSMAP_PASS }}
        run: |
          sudo apt-get -qq install -y sshpass >/dev/null; pip -q install netCDF4 numpy
          mkdir -p ~/.ssh; ssh-keyscan -t ecdsa hokusai.eorc.jaxa.jp 2>/dev/null > kh
          [ "$(ssh-keygen -lf kh | awk '{print $2}')" = "SHA256:kkL3TavqWMH/An1zfx3nL20SrWZfgivga+K6Ro+UIY8" ] && cp kh ~/.ssh/known_hosts
          T=$(date -u -d '-3 hour' +%Y%m%d.%H00); D=$(date -u -d '-3 hour' +%Y/%m/%d)
          printf -- "-get /now/netcdf/$D/gsmap_now_rain.$T.nc a.nc\n-get /now/half_hour_G/$D/gsmap_gauge_now.$T.dat.gz a.dat.gz\n" > b
          SSHPASS="$GSMAP_PASS" sshpass -e sftp -oBatchMode=no -oStrictHostKeyChecking=yes -P 22 -b b "$GSMAP_USER@hokusai.eorc.jaxa.jp" >/dev/null 2>&1 || true
          ls -la a.nc a.dat.gz
          node -e "
            import('./scripts/gsmap.mjs').then(m=>{const a=m.cropGsmap(require('fs').readFileSync('a.dat.gz'));
            require('fs').writeFileSync('crop.bin',Buffer.from(a.buffer));});"
          python3 - <<'PY'
          import numpy as np, netCDF4
          nc=netCDF4.Dataset('a.nc'); print({k:(v.shape, getattr(v,'units','')) for k,v in nc.variables.items()})
          lat=np.array(nc['Latitude'][:]); lon=np.array(nc['Longitude'][:])
          gc=np.array(nc['hourlyPrecipRateGC'][0]).astype(float)
          print('lat range', lat.min(), lat.max(), 'first', lat.flat[0], 'lon first', lon.flat[0], 'shape', gc.shape)
          crop=np.frombuffer(open('crop.bin','rb').read(),np.int16).reshape(200,180)/10.0
          LA=5.05+0.1*np.arange(200); LO=92.05+0.1*np.arange(180)
          if lat.ndim==2: la1=lat[:,0]; lo1=lon[0,:]
          else: la1=lat; lo1=lon
          iy=np.array([np.argmin(abs(la1-v)) for v in LA]); ix=np.array([np.argmin(abs(lo1-v)) for v in LO])
          ref=gc[np.ix_(iy,ix)] if gc.shape==(la1.size,lo1.size) else gc.T[np.ix_(iy,ix)]
          ok=(crop>=0)&(ref>=0)
          r=np.corrcoef(crop[ok],ref[ok])[0,1]; rf=np.corrcoef(crop[::-1][ok[::-1]],ref[ok[::-1]])[0,1]
          msg=f"cells {ok.sum()}, wet(ref>0.5) {(ref[ok]>0.5).sum()}, r(binary crop, netCDF GC)={r:.3f}, r(flipped)={rf:.3f}, max diff {np.abs(crop[ok]-ref[ok]).max():.2f}"
          print(msg); print('::notice title=GSMaP orientation::'+msg)
          PY
