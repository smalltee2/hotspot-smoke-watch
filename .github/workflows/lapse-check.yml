# One-off: the lapse rate Open-Meteo applies to temperature_2m (scripts/checks/openmeteo_lapse.py). Annotation only.
name: Open-Meteo lapse-rate check
on:
  push:
    branches: [main]
    paths: ['.github/workflows/lapse-check.yml', 'scripts/checks/openmeteo_lapse.py']
permissions: { contents: read }
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - run: python3 scripts/checks/openmeteo_lapse.py
