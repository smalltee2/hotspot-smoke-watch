name: Hourly update

on:
  schedule:
    - cron: '37 */3 * * *'   # backup only; the hourly trigger is an external cron (cron-job.org → workflow_dispatch at :07)
  workflow_dispatch: {}    # "Run workflow" button for manual runs
  push:
    branches: [main]
    paths: ['scripts/**', 'index.html', '.github/workflows/update.yml']   # rerun and redeploy when code or page changes

# Pages is deployed from this workflow (Settings → Pages → Source: GitHub Actions).
# Large, constantly changing files (latest/met/state JSON) go only to Pages and the Actions cache.
# The per-run forecast/observation logs and the Air4Thai archive live on the separate branch "history", which keeps only
# the last 35 days as one squashed commit per day (older commits become unreachable and are garbage-collected), so the
# repository does not grow; the maintainer's computer downloads them every day and keeps the full archive.
permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: hourly-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Restore working state from the last run
        uses: actions/cache/restore@v4
        with:
          path: |
            data/state.json
            data/met.json
            data/latest.json
            data/landcover.bin
            data/verify.json
          key: pipeline-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: pipeline-state-

      - name: Restore forecast history (branch "history") and ML training store (branch "mltrain")
        id: restore
        run: |
          set -e
          # a branch that exists but cannot be fetched fails the job: the push steps below must never replace it with an empty tree
          restore() { local br=$1 dir=$2; mkdir -p "$dir"
            rc=0; git ls-remote --exit-code --heads origin "$br" >/dev/null 2>&1 || rc=$?
            if [ $rc = 0 ]; then git fetch -q --depth=1 origin "$br" && git archive FETCH_HEAD "$dir" | tar -x
            elif [ $rc != 2 ]; then echo "cannot reach origin to check branch $br"; exit 1; fi
            echo "$br files: $(find "$dir" -type f | wc -l)"; }
          restore history data/history
          restore mltrain data/mltrain

      - name: Fetch data, correct forecast, write JSON
        env:
          OPENAQ_API_KEY: ${{ secrets.OPENAQ_API_KEY }}
          FIRMS_MAP_KEY: ${{ secrets.FIRMS_MAP_KEY }}
          NODE_EXTRA_CA_CERTS: scripts/certs/air4thai-chain.pem   # Let's Encrypt intermediates the Air4Thai server fails to send
        run: node scripts/update.mjs && node scripts/verify.mjs

      - name: Save working state for the next run
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            data/state.json
            data/met.json
            data/latest.json
            data/landcover.bin
            data/verify.json
          key: pipeline-state-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Commit static files (main) and forecast history (branch "history", last 35 days)
        if: always() && steps.restore.outcome == 'success'
        run: |
          git config user.name "hotspot-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # static files (terrain grid) on main
          git add data/static
          if ! git diff --cached --quiet; then git commit -qm "static: $(date -u +'%Y-%m-%d %H:%M UTC')"
            for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done; fi
          # history: drop files older than 35 days (date in the file name), then update the branch
          node -e 'const fs=require("fs"),p=require("path"),cut=new Date(Date.now()-35*864e5).toISOString().slice(0,10).replace(/-/g,"");
            const walk=d=>{for(const e of fs.readdirSync(d,{withFileTypes:true})){const f=p.join(d,e.name); if(e.isDirectory()){walk(f); if(!fs.readdirSync(f).length) fs.rmdirSync(f);} else {const m=/(\d{8})/.exec(e.name); if(m&&m[1]<cut) fs.unlinkSync(f);}}}; walk("data/history");'
          H="$RUNNER_TEMP/hist"; rm -rf "$H"; git worktree prune
          if git fetch -q --depth=1 origin history 2>/dev/null; then git worktree add -q -B history "$H" FETCH_HEAD; NEW=0
          else git worktree add -q --detach "$H"; (cd "$H" && git checkout -q --orphan history && git rm -rq --cached . && find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +); NEW=1; fi
          rm -rf "$H/data/history" && mkdir -p "$H/data/history" && cp -a data/history/. "$H/data/history/"
          cd "$H" && git add -A
          git diff --cached --quiet && exit 0
          LAST=$( [ "$NEW" = 0 ] && git log -1 --format=%cd --date=format:%Y-%m-%d HEAD || echo none )
          if [ "$LAST" != "$(date -u +%F)" ]; then
            # first update of a new UTC day: replace the branch by one commit holding only the kept files
            git checkout -q --orphan snap && git commit -qm "history snapshot $(date -u +'%Y-%m-%d %H:%M UTC') (last 35 days)" && git push -qf origin snap:history
          else
            git commit -qm "history: $(date -u +'%Y-%m-%d %H:%M UTC')" && git push -q origin HEAD:history || echo "::warning::history push failed"
          fi

      - name: Save ML training store (branch "mltrain", last 2 years)
        if: always() && steps.restore.outcome == 'success'
        run: |
          [ -d data/mltrain ] || exit 0
          node -e 'const fs=require("fs"),p=require("path"),cut=new Date(Date.now()-730*864e5).toISOString().slice(0,10).replace(/-/g,"");
            const walk=d=>{for(const e of fs.readdirSync(d,{withFileTypes:true})){const f=p.join(d,e.name); if(e.isDirectory()){walk(f); if(!fs.readdirSync(f).length) fs.rmdirSync(f);} else {const m=/(\d{8})/.exec(e.name); if(m&&m[1]<cut) fs.unlinkSync(f);}}}; walk("data/mltrain");'
          H="$RUNNER_TEMP/mlt"; rm -rf "$H"; git worktree prune
          if git fetch -q --depth=1 origin mltrain 2>/dev/null; then git worktree add -q -B mltrain "$H" FETCH_HEAD
          else git worktree add -q --detach "$H"; (cd "$H" && git checkout -q --orphan mltrain && git rm -rq --cached . && find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +); fi
          rm -rf "$H/data/mltrain" && mkdir -p "$H/data/mltrain" && cp -a data/mltrain/. "$H/data/mltrain/"
          cd "$H" && git add -A
          git diff --cached --quiet && exit 0
          # one squashed commit per update: the branch holds only the kept files, so deleted ones do not stay in its history
          git checkout -q --orphan snap && git commit -qm "ML training store $(date -u +'%Y-%m-%d %H:%M UTC') (2 years)" && git push -qf origin snap:mltrain

      - name: Build site
        id: build
        if: always()
        run: |
          mkdir -p _site/data/static
          # developer page = index.html as written; public page = the same file switched to public mode
          cp index.html _site/dev.html
          sed '0,/<html lang="en">/s//<html lang="en" data-mode="public">/' index.html > _site/index.html
          grep -q 'data-mode="public"' _site/index.html
          # page version = hash of the page source, so only a change to the page itself counts as a new version
          BUILD=$(sha1sum index.html | cut -c1-12)
          sed -i "s/<meta name=\"build\" content=\"dev\">/<meta name=\"build\" content=\"${BUILD}\">/" _site/index.html _site/dev.html
          grep -q "content=\"${BUILD}\"" _site/index.html && grep -q "content=\"${BUILD}\"" _site/dev.html
          echo "${BUILD}" > _site/build.txt
          for f in latest.json met-web.json verify.json runlog.json; do [ -f "data/$f" ] && cp "data/$f" _site/data/ || true; done
          [ -f data/static/elev.json ] && cp data/static/elev.json _site/data/static/ || true
          ls -la _site _site/data

      - uses: actions/configure-pages@v5
        if: always() && steps.build.outcome == 'success'
      - uses: actions/upload-pages-artifact@v3
        if: always() && steps.build.outcome == 'success'
        with:
          path: _site
      - id: deployment
        if: always() && steps.build.outcome == 'success'
        uses: actions/deploy-pages@v4
