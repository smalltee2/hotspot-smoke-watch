# README pass
# One-off check of the JAXA GSMaP data server before the rain upgrade is built:
# logs in with the GSMAP_USER / GSMAP_PASS secrets, verifies the server key against the fingerprint the
# owner saw on first connect, and lists the near-real-time folders. Results appear as annotations on the run.
name: GSMaP server check
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/gsmap-probe.yml']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: List GSMaP folders
        env:
          GSMAP_USER: ${{ secrets.GSMAP_USER }}
          GSMAP_PASS: ${{ secrets.GSMAP_PASS }}
          HOST: hokusai.eorc.jaxa.jp
          FP: SHA256:kkL3TavqWMH/An1zfx3nL20SrWZfgivga+K6Ro+UIY8
        run: |
          set -u
          if [ -z "$GSMAP_USER" ] || [ -z "$GSMAP_PASS" ]; then echo "::warning title=GSMaP::secrets GSMAP_USER / GSMAP_PASS not set"; exit 0; fi
          sudo apt-get -qq install -y sshpass >/dev/null
          mkdir -p ~/.ssh; ssh-keyscan -t ecdsa "$HOST" 2>/dev/null > kh
          got=$(ssh-keygen -lf kh | awk '{print $2}')
          if [ "$got" != "$FP" ]; then echo "::error title=GSMaP::server key $got does not match the expected $FP; not logging in"; exit 1; fi
          cp kh ~/.ssh/known_hosts
          printf -- '-pwd\n-ls -1 /\n-ls -1 /now\n-ls -1 /realtime\n-ls -1 /realtime_ver\n-ls -1 /standard\n' > b1
          export SSHPASS="$GSMAP_PASS"
          out=$(sshpass -e sftp -oBatchMode=no -oStrictHostKeyChecking=yes -P 22 -b b1 "$GSMAP_USER@$HOST" 2>&1 | grep -v -i "password" | head -80)
          echo "$out"
          # the two READMEs (file naming, format, latency)
          printf -- '-get /realtime/README.first.txt nrt.txt\n-get /now/README.first.txt now.txt\n' > b2
          sshpass -e sftp -oBatchMode=no -oStrictHostKeyChecking=yes -P 22 -b b2 "$GSMAP_USER@$HOST" >/dev/null 2>&1 || true
          # READMEs as annotations (≤ 10 per step): carriage returns removed, 1000-character pieces
          for f in nrt.txt now.txt; do [ -f $f ] || continue; tr -d '\r' < $f | tr '\n' '|' | tr -s ' ' > $f.1
            for k in 0 1 2 3; do piece=$(cut -c$((k*1000+1))-$((k*1000+1000)) $f.1); [ -n "$piece" ] && echo "::notice title=$f part $k::$piece"; done; done
