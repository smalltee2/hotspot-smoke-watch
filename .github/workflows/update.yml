name: Hourly update

on:
  schedule:
    - cron: '37 */3 * * *'   # backup only; the hourly trigger is an external cron (cron-job.org → workflow_dispatch at :07)
  workflow_dispatch: {}    # "Run workflow" button for manual runs
  push:
    branches: [main]
    paths: ['scripts/**', 'index.html', 'index_modern.html', '.github/workflows/update.yml']   # rerun and redeploy when code or page changes

# Pages is deployed from this workflow (Settings → Pages → Source: GitHub Actions).
# Large, constantly changing files (latest/met/state JSON) go only to Pages and the Actions cache.
# The per-run forecast/observation logs and the Air4Thai archive live on the separate branch "history", which keeps only
# the last 35 days as one squashed commit per day (older commits become unreachable and are garbage-collected), so the
# repository does not grow; the maintainer's computer downloads them every day and keeps the full archive.
permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: hourly-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Restore working state from the last run
        uses: actions/cache/restore@v4
        with:
          path: |
            data/state.json
            data/met.json
            data/latest.json
            data/rk-bias.json
            data/rk-bias-A.json
            data/landcover.bin
            data/verify.json
            data/gsmap-cache.json
            data/radar-cache.json
            data/met-web.json
            data/t2-corr.json
            data/rain-obs.json
            data/wx-ml.json
            data/perf.json
            data/perf-series.json
            data/ml-field.json
          key: pipeline-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: pipeline-state-

      - name: Restore forecast history (branch "history") and ML training store (branch "mltrain")
        id: restore
        run: |
          set -e
          # a branch that exists but cannot be fetched fails the job: the push steps below must never replace it with an empty tree
          # a brief network error must not cost the hour's forecast: the check and the fetch are tried 3 times, 10 s apart
          restore() { local br=$1 dir=$2 rc i; mkdir -p "$dir"
            for i in 1 2 3; do rc=0; git ls-remote --exit-code --heads origin "$br" >/dev/null 2>&1 || rc=$?
              if [ $rc = 0 ] || [ $rc = 2 ]; then break; fi; sleep 10; done
            if [ $rc = 0 ]; then
              for i in 1 2 3; do if git fetch -q --depth=1 origin "$br"; then break; fi
                if [ $i = 3 ]; then echo "cannot fetch branch $br (3 tries)"; exit 1; fi; sleep 10; done
              git archive FETCH_HEAD "$dir" | tar -x
            elif [ $rc != 2 ]; then echo "cannot reach origin to check branch $br (3 tries)"; exit 1; fi
            echo "$br files: $(find "$dir" -type f | wc -l)"; }
          restore history data/history
          restore mltrain data/mltrain

      - name: GSMaP server access (sftp; server key pinned to the fingerprint seen on first connect)
        env:
          GSMAP_USER: ${{ secrets.GSMAP_USER }}
        run: |
          [ -n "$GSMAP_USER" ] || exit 0
          sudo apt-get -qq install -y sshpass >/dev/null || echo "::warning title=GSMaP::sshpass not installed"
          mkdir -p ~/.ssh; ssh-keyscan -t ecdsa hokusai.eorc.jaxa.jp 2>/dev/null > kh || true
          if [ "$(ssh-keygen -lf kh 2>/dev/null | awk '{print $2}')" = "SHA256:kkL3TavqWMH/An1zfx3nL20SrWZfgivga+K6Ro+UIY8" ]; then cat kh >> ~/.ssh/known_hosts; else echo "::warning title=GSMaP::server key not as expected, observed rain skipped"; fi
          rm -f kh

      - name: SILAM forecast (FMI open data, NetCDF-4 read in Python; a new run about once a day, kept on the history branch)
        if: steps.restore.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 6
        run: python3 scripts/silam.py

      - name: Fetch data, correct forecast, write JSON
        env:
          OPENAQ_API_KEY: ${{ secrets.OPENAQ_API_KEY }}
          FIRMS_MAP_KEY: ${{ secrets.FIRMS_MAP_KEY }}
          GSMAP_USER: ${{ secrets.GSMAP_USER }}
          GSMAP_PASS: ${{ secrets.GSMAP_PASS }}
          NODE_EXTRA_CA_CERTS: scripts/certs/air4thai-chain.pem   # Let's Encrypt intermediates the Air4Thai server fails to send
          HSW_HTTP_CACHE: ${{ runner.temp }}/http   # replies kept for the SILAM run below (same measurements, sources asked once)
        run: node scripts/update.mjs && node scripts/verify.mjs

      - name: SILAM through the same chain (second run of update.mjs with SILAM in the place of CAMS; its own state, logs and page files)
        if: steps.restore.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 8
        env:
          OPENAQ_API_KEY: ${{ secrets.OPENAQ_API_KEY }}
          FIRMS_MAP_KEY: ${{ secrets.FIRMS_MAP_KEY }}
          NODE_EXTRA_CA_CERTS: scripts/certs/air4thai-chain.pem
          HSW_HTTP_CACHE: ${{ runner.temp }}/http
        run: node scripts/silam_chain.mjs

      - name: Model performance (perf.html; recomputed every 3 h from the logs)
        if: always()
        continue-on-error: true
        timeout-minutes: 5
        run: node scripts/perf.mjs

      - name: Public accuracy summary (accuracy.json; last 7 days at the hourly reference monitors, rebuilt every run)
        if: always()
        continue-on-error: true
        timeout-minutes: 3
        run: node scripts/accuracy.mjs

      - name: Save working state for the next run
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            data/state.json
            data/met.json
            data/latest.json
            data/rk-bias.json
            data/rk-bias-A.json
            data/landcover.bin
            data/verify.json
            data/gsmap-cache.json
            data/radar-cache.json
            data/met-web.json
            data/t2-corr.json
            data/rain-obs.json
            data/wx-ml.json
            data/perf.json
            data/perf-series.json
            data/ml-field.json
          key: pipeline-state-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Commit static files (main) and forecast history (branch "history", last 35 days)
        if: always() && steps.restore.outcome == 'success'
        run: |
          git config user.name "hotspot-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # static files (terrain grid) on main
          git add data/static
          if ! git diff --cached --quiet; then git commit -qm "static: $(date -u +'%Y-%m-%d %H:%M UTC')"
            for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done; fi
          # history: drop files older than 35 days (date in the file name), then update the branch
          node -e 'const fs=require("fs"),p=require("path"),cut=new Date(Date.now()-35*864e5).toISOString().slice(0,10).replace(/-/g,"");
            const walk=d=>{for(const e of fs.readdirSync(d,{withFileTypes:true})){const f=p.join(d,e.name); if(e.isDirectory()){walk(f); if(!fs.readdirSync(f).length) fs.rmdirSync(f);} else {const m=/(\d{8})/.exec(e.name); if(m&&m[1]<cut) fs.unlinkSync(f);}}}; walk("data/history");'
          # a brief network error must not cost the hour's logs: pushes are tried 3 times, 10 s apart
          push3() { for i in 1 2 3; do git push "$@" && return 0; sleep 10; done; return 1; }
          H="$RUNNER_TEMP/hist"; rm -rf "$H"; git worktree prune
          if git fetch -q --depth=1 origin history 2>/dev/null; then git worktree add -q -B history "$H" FETCH_HEAD; NEW=0
          else git worktree add -q --detach "$H"; (cd "$H" && git checkout -q --orphan history && git rm -rq --cached . && find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +); NEW=1; fi
          rm -rf "$H/data/history" && mkdir -p "$H/data/history" && cp -a data/history/. "$H/data/history/"
          cd "$H" && git add -A
          git diff --cached --quiet && exit 0
          LAST=$( [ "$NEW" = 0 ] && git log -1 --format=%cd --date=format:%Y-%m-%d HEAD || echo none )
          if [ "$LAST" != "$(date -u +%F)" ]; then
            # first update of a new UTC day: replace the branch by one commit holding only the kept files
            git checkout -q --orphan snap-history && git commit -qm "history snapshot $(date -u +'%Y-%m-%d %H:%M UTC') (last 35 days)" && push3 -qf origin snap-history:history
          else
            git commit -qm "history: $(date -u +'%Y-%m-%d %H:%M UTC')" && push3 -q origin HEAD:history || echo "::warning::history push failed"
          fi

      - name: Save ML training store (branch "mltrain", last 2 years)
        if: always() && steps.restore.outcome == 'success'
        run: |
          [ -d data/mltrain ] || exit 0
          node -e 'const fs=require("fs"),p=require("path"),cut=new Date(Date.now()-730*864e5).toISOString().slice(0,10).replace(/-/g,"");
            const walk=d=>{for(const e of fs.readdirSync(d,{withFileTypes:true})){const f=p.join(d,e.name); if(e.isDirectory()){walk(f); if(!fs.readdirSync(f).length) fs.rmdirSync(f);} else {const m=/(\d{8})/.exec(e.name); if(m&&m[1]<cut) fs.unlinkSync(f);}}}; walk("data/mltrain");'
          # a brief network error must not cost the hour's logs: pushes are tried 3 times, 10 s apart
          push3() { for i in 1 2 3; do git push "$@" && return 0; sleep 10; done; return 1; }
          H="$RUNNER_TEMP/mlt"; rm -rf "$H"; git worktree prune
          if git fetch -q --depth=1 origin mltrain 2>/dev/null; then git worktree add -q -B mltrain "$H" FETCH_HEAD
          else git worktree add -q --detach "$H"; (cd "$H" && git checkout -q --orphan mltrain && git rm -rq --cached . && find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +); fi
          rm -rf "$H/data/mltrain" && mkdir -p "$H/data/mltrain" && cp -a data/mltrain/. "$H/data/mltrain/"
          cd "$H" && git add -A
          git diff --cached --quiet && exit 0
          # one squashed commit per update: the branch holds only the kept files, so deleted ones do not stay in its history.
          # Its own temporary branch name: the history step's daily snapshot (same repository, other worktree) uses snap-history
          git checkout -q --orphan snap-mltrain && git commit -qm "ML training store $(date -u +'%Y-%m-%d %H:%M UTC') (2 years)" && push3 -qf origin snap-mltrain:mltrain

      - name: Build site
        id: build
        if: always()
        env:
          DEV_USER: ${{ secrets.DEV_USER }}
          DEV_PASS: ${{ secrets.DEV_PASS }}
        run: |
          mkdir -p _site/data/static
          # developer page = index.html as written; the original layout stays public at /classic.html (index.html switched to public mode)
          cp index.html _site/dev.html
          cp perf.html _site/perf.html
          sed '0,/<html lang="en">/s//<html lang="en" data-mode="public">/' index.html > _site/classic.html
          grep -q 'data-mode="public"' _site/classic.html
          # default public page (/ and /index.html) = the redesign: its own layout and styles, the page code of index.html (both
          # layouts read the same data files), public mode; also published at /index_modern.html so earlier links keep working
          node scripts/build_modern.mjs index.html index_modern.html _site/index.html
          sed -i '0,/<html lang="en">/s//<html lang="en" data-mode="public">/' _site/index.html
          grep -q 'data-mode="public"' _site/index.html
          cp _site/index.html _site/index_modern.html
          # the redesign's glass menu frames (motion and WebGL2 water), loaded by it as modules; the tests stay out of the site
          mkdir -p _site/glass && cp glass/nav.mjs glass/water.mjs glass/boot.mjs _site/glass/
          # logo and browser icon (assets/README.md)
          mkdir -p _site/assets && cp assets/*.svg _site/assets/
          # page version = hash of the page sources, so only a change to a page itself counts as a new version
          BUILD=$(cat index.html index_modern.html glass/nav.mjs glass/water.mjs glass/boot.mjs | sha1sum | cut -c1-12)
          sed -i "s/<meta name=\"build\" content=\"dev\">/<meta name=\"build\" content=\"${BUILD}\">/" _site/index.html _site/index_modern.html _site/classic.html _site/dev.html
          for f in index.html index_modern.html classic.html dev.html; do grep -q "content=\"${BUILD}\"" _site/$f; done
          echo "${BUILD}" > _site/build.txt
          # stamp.json: run time of latest.json + page version, polled by the pages every 3 min for the automatic refresh
          BUILD="${BUILD}" node -e 'const fs=require("fs"); let g=null; try{g=JSON.parse(fs.readFileSync("data/latest.json","utf8")).generated??null;}catch(e){}
            fs.writeFileSync("_site/data/stamp.json", JSON.stringify({generated:g, build:process.env.BUILD}));'
          # private pages: the developer page and the performance page are published encrypted (username + password from
          # the DEV_USER / DEV_PASS secrets; without them a notice is published instead of the page)
          node scripts/lockpage.mjs _site/dev.html _site/dev.html "Developer page"
          node scripts/lockpage.mjs _site/perf.html _site/perf.html "Model performance"
          if grep -q 'data-mode\|id="map"' _site/dev.html; then echo "developer page not encrypted"; exit 1; fi
          # met-traj.json is not in the Actions cache: after a run that failed before writing it, rebuild it from the cached met.json,
          # so the page's back-trajectories (announced in the cached latest.json) do not get a missing file
          if [ ! -f data/met-traj.json ] && [ -f data/met.json ] && [ -f data/latest.json ]; then
            node --input-type=module -e 'import fs from "node:fs"; import { packTraj } from "./scripts/met.mjs";
              const m = JSON.parse(fs.readFileSync("data/met.json", "utf8")), t = JSON.parse(fs.readFileSync("data/latest.json", "utf8")).generated, H = 3600e3;
              const tr = t ? packTraj(m, t - 49 * H, t + 75 * H) : null; if (tr) fs.writeFileSync("data/met-traj.json", JSON.stringify(tr));' || echo "::warning title=met-traj::could not rebuild met-traj.json"
          fi
          for f in latest.json met-web.json met-traj.json ml-field.json t2-corr.json rain-obs.json wx-ml.json perf.json perf-series.json rk-bias.json rk-bias-A.json verify.json runlog.json accuracy.json; do [ -f "data/$f" ] && cp "data/$f" _site/data/ || true; done
          for f in elev.json elev025.json; do [ -f data/static/$f ] && cp data/static/$f _site/data/static/ || true; done
          # the SILAM chain's page files (absent when its run failed: the page then hides the SILAM layer)
          if [ -f data/silam/latest.json ]; then mkdir -p _site/data/silam && cp data/silam/*.json _site/data/silam/; fi
          [ -d data/static/prclim ] && cp -r data/static/prclim _site/data/static/ || true
          ls -la _site _site/data

      - uses: actions/configure-pages@v5
        if: always() && steps.build.outcome == 'success'
      - uses: actions/upload-pages-artifact@v3
        if: always() && steps.build.outcome == 'success'
        with:
          path: _site
      # GitHub sometimes does not list a just-uploaded Pages artifact yet ("No artifacts named github-pages were found",
      # run #1382): wait and deploy once more instead of losing the hour. A second failure still fails the job.
      - id: deployment
        if: always() && steps.build.outcome == 'success'
        continue-on-error: true
        uses: actions/deploy-pages@v4
      - if: always() && steps.deployment.outcome == 'failure'
        run: sleep 45
      - id: deployment_retry
        if: always() && steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
